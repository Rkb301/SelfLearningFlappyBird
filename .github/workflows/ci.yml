name: Verify Flappy Bird source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile game and inference scripts
        run: python -m py_compile flappy_bird_ai.py play_best_bird.py
      - name: Smoke-test imports in headless environment
        env:
          SDL_VIDEODRIVER: dummy
        run: python -c "import pygame, numpy; print('dependencies loaded')"
